<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Самолет в небе - Canvas Animation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body
    class="relative flex items-center justify-center min-h-screen text-white"
  >
    <canvas id="skyCanvas"></canvas>

    <div
      class="absolute top-6 left-6 z-10 glass-panel p-5 rounded-2xl shadow-2xl max-w-xs w-full transition-all duration-300 hover:border-sky-400/40"
    >
      <h1 class="text-xl font-bold mb-1 flex items-center gap-2 text-sky-400">
        <i class="fa-solid font-sharp fa-plane"></i>
        Полет Самолета
      </h1>
      <p class="text-xs text-slate-300 mb-4">
        Управляйте параметрами полета и анимации в реальном времени
      </p>

      <div class="mb-4">
        <div class="flex justify-between text-xs font-semibold mb-1">
          <span class="text-slate-300">Скорость полета</span>
          <span id="speedVal" class="text-sky-400">1.0x</span>
        </div>
        <input
          type="range"
          id="speedSlider"
          min="0.2"
          max="3.0"
          step="0.1"
          value="1.0"
          class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-sky-400"
        />
      </div>

      <div class="mb-4">
        <div class="flex justify-between text-xs font-semibold mb-1">
          <span class="text-slate-300">Скорость пропеллера</span>
          <span id="propVal" class="text-sky-400">1.0x</span>
        </div>
        <input
          type="range"
          id="propSlider"
          min="0.1"
          max="3.0"
          step="0.1"
          value="1.0"
          class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-sky-400"
        />
      </div>

      <div class="mb-4">
        <div class="flex justify-between text-xs font-semibold mb-1">
          <span class="text-slate-300">Турбулентность</span>
          <span id="turbVal" class="text-sky-400">Средняя</span>
        </div>
        <input
          type="range"
          id="turbSlider"
          min="0"
          max="2"
          step="0.1"
          value="1.0"
          class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-sky-400"
        />
      </div>

      <div
        class="pt-2 border-t border-slate-700/60 flex items-center justify-between"
      >
        <span class="text-xs font-semibold text-slate-300">Время суток</span>
        <button
          id="timeBtn"
          class="px-3 py-1.5 text-xs bg-sky-500 hover:bg-sky-400 font-medium rounded-lg transition-colors flex items-center gap-1.5 shadow-md shadow-sky-500/20"
        >
          <i class="fa-solid fa-sun" id="timeIcon"></i>
          <span id="timeText">День</span>
        </button>
      </div>

      <div
        class="pt-2 mt-2 border-t border-slate-700/60 items-center justify-between"
      >
        <span class="text-ts font-semibold text-slate-300">CONTROLE</span>
        <button
          class="px-3 py-1.5 text-xs bg-indigo-500 hover:bg-indigo-400 font-medium rounded-lg transition-colors flex items-center gap-1.5 shadow-md shadow-indigo-500/20"
          id="controls"
        >
          <i class="fa-solid fa-plane" id="controlIcon"></i>
          <span id="controlText">Дефолт</span>
        </button>
      </div>
    </div>

    <div
      class="absolute bottom-6 right-6 z-10 glass-panel px-4 py-2.5 rounded-xl text-xs text-slate-300 pointer-events-none hidden sm:block"
    >
      Кликните по экрану, чтобы заставить самолет качнуться!
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
